<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Advanced Positioning Task</title> 
<style> 
body{
    position:relative;
}
.box-static{
    position:static;
    background-color:rgb(130, 196, 214); 
    margin: 10px;
    width:120px;
    height: 120px;
}

.box-relative-1{
    position:relative;
    background-color: #93f393;
    width:150px;
    height: 150px;
    margin-top: 30px;
    margin-left: 30px;
}

.box-relative-2{
    position:relative;
    background-color: pink;
    width:170px;
    height: 170px;
    margin-top:-30px;
    margin-left: 40px;
}

.container{
    position:relative;
    background-color:rgb(196, 196, 196);
    margin-top:48px;
    margin-left:15px;
    width:400px;
    height: 400px;
    padding-top: 30px;
    padding-left:30px;
}

.box-absolute-1{
    position:absolute;
background-color:rgb(249, 151, 115);
width:170px;
    height: 170px;

   z-index:3;
}

.box-absolute-2{
    position:absolute;
background-color:rgb(104, 208, 232);
width:190px;
    height: 190px;
    margin-top:50px;
    margin-left: 30px;
    z-index:2;
}

.box-absolute-3{
    position:absolute;
background-color: purple;
width:210px;
    height: 210px;
    margin-top:100px;
    margin-left: 60px;
    z-index:1;   
}

.box-zindex-1{
position:absolute;
background-color:indianred;    
    width: 230px;
    height: 230px;
    top: 50px; 
    left:215px;      
    z-index: 5;    
   

}

.box-zindex-2{
position:absolute;
background-color:rgb(14, 164, 157);    
    width: 230px;
    height: 230px;
    top: 130px;     
    left:270px;
    z-index: 4;    

}

.box-fixed-1{
position:fixed;
top:0;
right:850px;
background-color:yellow; 
    width:110px;
    height: 110px;
}

.box-fixed-2{
position:fixed;
bottom:0;
left:0;
background-color:orange; 
    width:110px;
    height: 110px;
}
</style> 
</head> 
<body> 
<!-- Static positioned boxes --> 
<div class="box-static">Static</div> 
<div class="box-static">Static</div> 
<!-- Relative positioned boxes --> 
<div class="box-relative-1">Relative 1</div> 
<div class="box-relative-2">Relative 2</div> 
<!-- Container with absolute positioned boxes inside --> 
<div class="container"> 
<div class="box-absolute-1">Absolute 1</div> 
<div class="box-absolute-2">Absolute 2</div> 
<div class="box-absolute-3">Absolute 3</div> 
</div> 
<!-- Overlapping boxes with z-index outside container --> 
<div class="box-zindex-1">Z-Index 5</div> 
<div class="box-zindex-2">Z-Index 4</div> 
<!-- Fixed positioned boxes --> 
<div class="box-fixed-1">Fixed Top-Right</div> 
<div class="box-fixed-2">Fixed Bottom-Left</div> 
</body> 
</html>
